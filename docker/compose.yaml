# One file, add-ons as profiles (S§5.14). The `browser` and `searxng` profiles arrive in
# Phases 6 and 2.
name: agentic-dasher

services:
  core:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: agentic-dasher:local
    init: true
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      # Host names the API answers for besides IP addresses and local names (README, "Run it").
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      FETCH_DENY_CIDRS: ${FETCH_DENY_CIDRS:-}
    volumes:
      - data:/data

volumes:
  data:
